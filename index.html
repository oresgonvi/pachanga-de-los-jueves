<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pachanga de los Jueves</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        .beer-anim { 
            display: inline-block; 
            transform-origin: bottom center; 
            animation: swing 3s infinite ease-in-out; 
        }
        @keyframes swing { 
            0%, 100% { transform: rotate(-5deg); } 
            50% { transform: rotate(5deg); } 
        }
        
        input, select, textarea { font-size: 16px !important; } 
        .touch-target { min-height: 44px; min-width: 44px; cursor: pointer; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .sticky-col { position: sticky; left: 0; z-index: 20; background-color: white; }
        .sticky-shadow { box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-100 font-sans pb-24 text-slate-800 selection:bg-orange-200 antialiased">

    <!-- Loading -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-100 gap-4 text-slate-400 transition-opacity duration-500">
        <div class="relative">
            <i data-lucide="refresh-cw" class="w-10 h-10 animate-spin-custom text-orange-500"></i>
        </div>
        <span class="text-xs font-bold uppercase tracking-widest">Conectando...</span>
    </div>

    <!-- Main App -->
    <div id="main-content" class="hidden opacity-0 transition-opacity duration-500">
        
        <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-xl border-b border-slate-800">
            <div class="max-w-4xl mx-auto px-4 py-3 md:py-4">
                
                <!-- Header Content -->
                <div class="relative flex flex-col items-center justify-center mb-4 pt-1">
                    <!-- Edit Btn -->
                    <div class="absolute top-1 right-0">
                         <button onclick="Actions.toggleEditMode()" id="btn-edit-mode" 
                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold transition-all border bg-slate-800/80 backdrop-blur border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-white hover:border-slate-600 active:scale-95">
                            EDITAR
                        </button>
                    </div>

                    <!-- Logo & Title -->
                    <div class="flex flex-col items-center gap-2 mt-1">
                        <div class="p-2.5 rounded-full text-white border-4 border-slate-800 flex items-center justify-center bg-slate-800 shadow-xl shadow-orange-500/10 relative group cursor-pointer hover:scale-105 transition-transform duration-300">
                            <span class="text-3xl md:text-4xl leading-none filter drop-shadow-md" role="img" aria-label="basketball">🏀</span>
                        </div>
                        
                        <div class="text-center">
                            <h1 class="font-black text-xl md:text-2xl leading-none tracking-tight text-white flex items-center justify-center gap-2 mb-1.5">
                                Pachanga de los jueves <span class="text-xl md:text-2xl beer-anim" title="Tercer tiempo">🍺</span>
                            </h1>
                            
                            <div class="flex items-center justify-center gap-2">
                                <span class="text-orange-400 text-[10px] font-bold uppercase tracking-widest bg-orange-500/10 px-2 py-0.5 rounded border border-orange-500/20">Baloncesto</span>
                                <div class="bg-slate-800 px-2 py-0.5 rounded-full flex items-center gap-1.5 border border-slate-700 shadow-sm">
                                    <span id="connection-icon"></span>
                                    <span id="connection-text" class="text-[9px] text-slate-400 font-mono uppercase">...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Month Navigator -->
                <div class="flex items-center justify-between bg-slate-800/50 backdrop-blur-md p-1 rounded-xl border border-slate-700/50 shadow-inner">
                    <button onclick="Actions.changeMonth(-1)" class="touch-target w-10 h-10 flex items-center justify-center hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors active:bg-slate-600">
                        <i data-lucide="chevron-left" class="w-6 h-6"></i>
                    </button>
                    <div class="text-center">
                        <h2 id="month-display" class="text-base md:text-lg font-bold text-white tracking-tight"></h2>
                        <button onclick="Actions.goToToday()" class="text-[9px] md:text-[10px] text-slate-500 hover:text-orange-400 uppercase font-bold tracking-wider transition-colors">Ir a hoy</button>
                    </div>
                    <button onclick="Actions.changeMonth(1)" class="touch-target w-10 h-10 flex items-center justify-center hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors active:bg-slate-600">
                        <i data-lucide="chevron-right" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- INVOICE EDITOR (Visible in Edit Mode) -->
                <div id="invoice-editor" class="hidden mt-3 bg-orange-500/10 border border-orange-500/20 rounded-lg p-2 flex items-center justify-between animate-fade-in">
                    <span class="text-xs font-bold text-orange-200 uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="receipt" class="w-3 h-3"></i> Factura Total:
                    </span>
                    <div class="flex items-center gap-1">
                        <input type="number" id="invoice-input" 
                            onchange="Actions.updateInvoiceTotal(this.value)"
                            placeholder="0.00" 
                            class="w-24 bg-slate-900/50 border border-slate-600 rounded px-2 py-1 text-right text-white font-mono font-bold focus:outline-none focus:border-orange-400 transition-colors text-sm">
                        <span class="text-orange-200 font-bold text-xs">€</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-3 md:px-4 py-4 md:py-6 relative z-20">
            
            <!-- KPIs -->
            <div class="grid grid-cols-3 gap-2 md:gap-4 mb-4">
                <!-- Previsto -->
                <div class="bg-white p-2 md:p-3 rounded-xl md:rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between h-20 md:h-24">
                    <span class="text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-wider flex flex-col md:flex-row md:items-center gap-1">
                        <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> Previsto</span>
                    </span>
                    <span id="kpi-expected" class="text-base md:text-2xl font-black text-slate-800 truncate">0.00€</span>
                </div>
                <!-- Caja Total -->
                <div class="bg-white p-2 md:p-3 rounded-xl md:rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between h-20 md:h-24 relative overflow-hidden group">
                    <div class="absolute right-0 top-0 w-8 h-8 md:w-12 md:h-12 bg-green-50 rounded-bl-full -mr-2 -mt-2 z-0 transition-transform group-hover:scale-110"></div>
                    <span class="text-[9px] md:text-[10px] font-bold text-green-600 uppercase tracking-wider flex flex-col md:flex-row md:items-center gap-1 relative z-10">
                        <span class="flex items-center gap-1"><i data-lucide="dollar-sign" class="w-3 h-3"></i> Recaudado</span>
                    </span>
                    <span id="kpi-collected" class="text-base md:text-2xl font-black text-green-600 relative z-10 truncate">0.00€</span>
                </div>
                <!-- Pendiente -->
                <div id="kpi-debt-card" class="p-2 md:p-3 rounded-xl md:rounded-2xl shadow-sm border flex flex-col justify-between h-20 md:h-24 transition-colors bg-white border-slate-200">
                    <span id="kpi-debt-label" class="text-[9px] md:text-[10px] font-bold uppercase tracking-wider flex flex-col md:flex-row md:items-center gap-1 text-slate-400">
                        <span class="flex items-center gap-1"><i data-lucide="alert-circle" class="w-3 h-3"></i> Pendiente</span>
                    </span>
                    <span id="kpi-debt" class="text-base md:text-2xl font-black text-slate-300 truncate">0.00€</span>
                </div>
            </div>

            <!-- Breakdown: Fijos vs Casuals (MOSTRANDO DEUDA TOTAL/ESPERADO) -->
            <div class="grid grid-cols-2 gap-2 md:gap-4 mb-6">
                <div class="bg-orange-50/50 p-2 rounded-xl border border-orange-100 flex items-center justify-between">
                    <span class="text-[9px] md:text-[10px] font-bold text-orange-400 uppercase tracking-wider">Total Fijos</span>
                    <span id="kpi-fijos-expected" class="text-sm md:text-lg font-black text-orange-600">0.00€</span>
                </div>
                <div class="bg-blue-50/50 p-2 rounded-xl border border-blue-100 flex items-center justify-between">
                    <span class="text-[9px] md:text-[10px] font-bold text-blue-400 uppercase tracking-wider">Total Casuals</span>
                    <span id="kpi-casuals-expected" class="text-sm md:text-lg font-black text-blue-600">0.00€</span>
                </div>
            </div>

            <!-- Tabs -->
            <nav class="flex p-1 bg-white border border-slate-200 rounded-xl mb-6 shadow-sm sticky top-[170px] z-30 md:static">
                <button onclick="Actions.setActiveTab('resumen')" class="tab-btn flex-1 py-2 rounded-lg text-[11px] md:text-xs font-bold uppercase tracking-wider transition-all" data-tab="resumen">Resumen</button>
                <button onclick="Actions.setActiveTab('fijos')" class="tab-btn flex-1 py-2 rounded-lg text-[11px] md:text-xs font-bold uppercase tracking-wider transition-all" data-tab="fijos">Fijos</button>
                <button onclick="Actions.setActiveTab('casuals')" class="tab-btn flex-1 py-2 rounded-lg text-[11px] md:text-xs font-bold uppercase tracking-wider transition-all" data-tab="casuals">Casuals</button>
            </nav>

            <!-- Tables Container -->
            <div id="tables-container" class="space-y-6 md:space-y-8"></div>

            <footer class="mt-12 text-center pb-8 border-t border-slate-200 pt-8">
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-2">Pachanga de los Jueves • Baloncesto</p>
                <p class="text-[9px] text-slate-300">Powered by Firebase Cloud Sync</p>
            </footer>
        </main>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIG ---
        const CONSTANTS = {
            COLLECTION: 'pachanga_shared',
            DOC_ID: 'game_state',
            INITIAL_STATE: {
                fijos: [
                    { id: 'f1', name: 'Alvaro' }, { id: 'f2', name: 'Carlos' }, { id: 'f3', name: 'Roge' },
                    { id: 'f4', name: 'Refo' }, { id: 'f5', name: 'Ruben' }, { id: 'f6', name: 'Jose' },
                    { id: 'f7', name: 'Adri' }, { id: 'f8', name: 'Ores' }, { id: 'f9', name: 'Jaime' }
                ],
                casuals: [
                    { id: 'c1', name: 'Emilio' }, { id: 'c2', name: 'Lino' }, { id: 'c3', name: 'Raul' },
                    { id: 'c4', name: 'Edu' }, { id: 'c5', name: 'Ivan' }
                ],
                attendance: {},
                payments: {},
                customFees: {},
                invoices: {}, 
                config: { fixedFee: 11.70, casualFee: 3.00 }
            },
            DAYS: { THURSDAY: 4 }
        };

        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app';

        // --- STORE ---
        const Store = {
            user: null,
            syncStatus: 'disconnected',
            viewDate: new Date(),
            activeTab: 'resumen',
            editMode: false,
            data: { ...CONSTANTS.INITIAL_STATE },
            inputs: { fijos: '', casuals: '' }, 
            
            getThursdays() {
                return Utils.getThursdaysInMonth(this.viewDate.getFullYear(), this.viewDate.getMonth());
            },
            getMonthKey() {
                return Utils.getMonthKey(this.viewDate);
            }
        };

        // --- UTILS ---
        const Utils = {
            getThursdaysInMonth(year, month) {
                const dates = [];
                const date = new Date(year, month, 1);
                while (date.getDay() !== CONSTANTS.DAYS.THURSDAY) date.setDate(date.getDate() + 1);
                while (date.getMonth() === month) {
                    dates.push(new Date(date));
                    date.setDate(date.getDate() + 7);
                }
                return dates;
            },
            formatDateKey(date) {
                const offset = date.getTimezoneOffset();
                const localDate = new Date(date.getTime() - (offset * 60 * 1000));
                return localDate.toISOString().split('T')[0];
            },
            getMonthKey(date) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            },
            capitalize(str) {
                return str.charAt(0).toUpperCase() + str.slice(1);
            },
            formatMoney(amount) {
                return amount.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';
            }
        };

        // --- FIREBASE ---
        const Service = {
            async initAuth() {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                    else await signInAnonymously(auth);
                } catch (error) { console.error(error); await signInAnonymously(auth); }
            },
            setupSync() {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', CONSTANTS.COLLECTION, CONSTANTS.DOC_ID);
                UI.setSyncStatus('syncing');
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) {
                        Store.data = { ...Store.data, ...snapshot.data() };
                        if(!Store.data.customFees) Store.data.customFees = {};
                        if(!Store.data.invoices) Store.data.invoices = {};
                        UI.setSyncStatus('synced');
                        UI.hideLoading();
                        UI.render();
                    } else setDoc(docRef, CONSTANTS.INITIAL_STATE);
                });
            },
            async updateField(field, value) {
                if (!Store.user) return alert("Sin conexión");
                UI.setSyncStatus('syncing');
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', CONSTANTS.COLLECTION, CONSTANTS.DOC_ID), { [field]: value });
            }
        };

        // --- UI ---
        const UI = {
            setSyncStatus(status) {
                const config = {
                    syncing: { icon: 'refresh-cw', color: 'text-yellow-400', anim: 'animate-spin-custom', text: 'SYNCING' },
                    synced: { icon: 'wifi', color: 'text-green-400', anim: '', text: 'ONLINE' },
                    disconnected: { icon: 'wifi-off', color: 'text-slate-400', anim: '', text: 'OFFLINE' }
                };
                const s = config[status] || config.disconnected;
                document.getElementById('connection-icon').innerHTML = `<i data-lucide="${s.icon}" class="w-3 h-3 ${s.color} ${s.anim}"></i>`;
                document.getElementById('connection-text').textContent = s.text;
                document.getElementById('connection-text').className = `text-[9px] font-mono uppercase ${s.color}`;
                lucide.createIcons();
            },

            hideLoading() {
                const loader = document.getElementById('loading-screen');
                if (!loader.classList.contains('hidden')) {
                    loader.classList.add('opacity-0');
                    setTimeout(() => { 
                        loader.classList.add('hidden'); 
                        document.getElementById('main-content').classList.remove('hidden', 'opacity-0'); 
                    }, 500);
                }
            },

            renderKPIs(totals) {
                document.getElementById('kpi-expected').textContent = Utils.formatMoney(totals.expected);
                document.getElementById('kpi-collected').textContent = Utils.formatMoney(totals.collected);
                document.getElementById('kpi-debt').textContent = Utils.formatMoney(totals.debt);
                
                // Update breakdown to show EXPECTED (calculated box), not COLLECTED (paid)
                document.getElementById('kpi-fijos-expected').textContent = Utils.formatMoney(totals.expectedFijos);
                document.getElementById('kpi-casuals-expected').textContent = Utils.formatMoney(totals.expectedCasuals);

                const hasDebt = totals.debt > 0.1;
                document.getElementById('kpi-debt-card').className = `p-2 md:p-3 rounded-xl md:rounded-2xl shadow-sm border flex flex-col justify-between h-20 md:h-24 transition-colors ${hasDebt ? 'bg-red-50 border-red-100' : 'bg-white border-slate-200'}`;
                document.getElementById('kpi-debt').className = `text-base md:text-2xl font-black truncate ${hasDebt ? 'text-red-500' : 'text-slate-300'}`;
            },

            render() {
                const monthKey = Store.getMonthKey();
                const thursdays = Store.getThursdays();
                document.getElementById('month-display').textContent = Utils.capitalize(Store.viewDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' }));

                const editBtn = document.getElementById('btn-edit-mode');
                const invoiceEditor = document.getElementById('invoice-editor');
                
                if (Store.editMode) {
                    editBtn.innerHTML = '<i data-lucide="save" class="w-3 h-3 md:w-4 md:h-4"></i> GUARDAR';
                    editBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold transition-all border bg-orange-500 border-orange-500 text-white shadow-lg active:scale-95";
                    invoiceEditor.classList.remove('hidden');
                    document.getElementById('invoice-input').value = Store.data.invoices[monthKey] || '';
                } else {
                    editBtn.innerHTML = 'EDITAR';
                    editBtn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[10px] font-bold transition-all border bg-slate-800/80 backdrop-blur border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-white active:scale-95";
                    invoiceEditor.classList.add('hidden');
                }

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.className = (btn.dataset.tab === Store.activeTab) 
                        ? "tab-btn flex-1 py-2 rounded-lg text-[11px] md:text-xs font-bold uppercase tracking-wider transition-all bg-slate-900 text-white shadow-md scale-100"
                        : "tab-btn flex-1 py-2 rounded-lg text-[11px] md:text-xs font-bold uppercase tracking-wider transition-all text-slate-500 hover:bg-slate-50";
                });

                // --- LOGIC CORE ---
                
                // 1. Casuals Expected Revenue
                let totalCasualsRevenue = 0;
                Store.data.casuals.forEach(p => {
                    const games = thursdays.filter(d => Store.data.attendance[`${Utils.formatDateKey(d)}_${p.id}`]).length;
                    totalCasualsRevenue += (games * Store.data.config.casualFee);
                });

                // 2. Fijos Calculation
                const currentInvoice = parseFloat(Store.data.invoices[monthKey] || 0);
                const numFijos = Store.data.fijos.length;
                const dynamicFixedFee = (currentInvoice > 0 && numFijos > 0) 
                    ? (currentInvoice - totalCasualsRevenue) / numFijos 
                    : Store.data.config.fixedFee;

                // 3. Totals
                let expectedTotal = 0;
                let collectedTotal = 0;
                let expectedFijos = 0; // New accumulator for expected breakdown

                Store.data.fijos.forEach(p => {
                    const customFee = Store.data.customFees[`${monthKey}_${p.id}`];
                    const feeToPay = customFee !== undefined ? customFee : dynamicFixedFee;
                    const amount = Math.max(0, feeToPay);
                    expectedTotal += amount;
                    expectedFijos += amount; // Accumulate expected per user
                    collectedTotal += (Store.data.payments[`${monthKey}_${p.id}`] || 0);
                });

                expectedTotal += totalCasualsRevenue;
                Store.data.casuals.forEach(p => {
                    collectedTotal += (Store.data.payments[`${monthKey}_${p.id}`] || 0);
                });

                this.renderKPIs({ 
                    expected: expectedTotal, 
                    collected: collectedTotal, 
                    debt: expectedTotal - collectedTotal, 
                    expectedFijos, 
                    expectedCasuals: totalCasualsRevenue 
                });

                const container = document.getElementById('tables-container');
                let html = '';
                if (Store.activeTab !== 'casuals') html += this.generateTable('fijos', Store.data.fijos, thursdays, dynamicFixedFee);
                if (Store.activeTab !== 'fijos') html += this.generateTable('casuals', Store.data.casuals, thursdays, Store.data.config.casualFee);
                container.innerHTML = html;
                lucide.createIcons();
            },

            generateTable(type, players, thursdays, currentFee) {
                const isFijos = type === 'fijos';
                const theme = isFijos ? { t: 'text-orange-600', b: 'bg-orange-50', i: 'lock' } : { t: 'text-blue-600', b: 'bg-blue-50', i: 'unlock' };
                const monthKey = Store.getMonthKey();

                const rows = players.map(p => {
                    const games = thursdays.filter(d => Store.data.attendance[`${Utils.formatDateKey(d)}_${p.id}`]).length;
                    const customFee = Store.data.customFees[`${monthKey}_${p.id}`];
                    
                    let toPay;
                    if (isFijos) {
                        toPay = customFee !== undefined ? parseFloat(customFee) : Math.max(0, currentFee);
                    } else {
                        toPay = games * currentFee;
                    }

                    const paid = Store.data.payments[`${monthKey}_${p.id}`] || 0;
                    const isPaid = (toPay - paid) <= 0.1;

                    const cells = thursdays.map(d => {
                        const dKey = Utils.formatDateKey(d);
                        const att = !!Store.data.attendance[`${dKey}_${p.id}`];
                        return `<td class="p-1 text-center border-l border-slate-50 relative whitespace-nowrap">
                            <button onclick="Actions.toggleAttendance('${p.id}', '${dKey}')" class="touch-target w-8 h-8 mx-auto flex items-center justify-center rounded-full border-2 transition-all ${att ? 'bg-orange-500 border-orange-500 text-white shadow-sm scale-100' : 'bg-white border-slate-200 text-transparent hover:border-orange-300 scale-90'}">
                                ${att ? '<i data-lucide="activity" class="w-4 h-4"></i>' : ''}
                            </button>
                        </td>`;
                    }).join('');

                    let totalCell;
                    if (Store.editMode && isFijos) {
                        totalCell = `<td class="px-2 py-2 text-right bg-orange-50/20 border-l border-slate-200 whitespace-nowrap">
                            <input type="number" value="${customFee !== undefined ? customFee : ''}" placeholder="${Math.max(0, currentFee).toFixed(2)}" onchange="Actions.updateCustomFee('${p.id}', this.value)" class="w-16 text-right p-1 rounded text-xs border border-orange-300/50 font-mono font-bold text-slate-700 outline-none">
                        </td>`;
                    } else {
                        totalCell = `<td class="px-2 py-2 text-right font-mono font-bold text-slate-700 bg-orange-50/20 text-xs border-l border-slate-200 relative whitespace-nowrap">
                            ${toPay.toFixed(2)} ${customFee !== undefined ? '<span class="absolute top-1 right-1 w-1.5 h-1.5 bg-orange-500 rounded-full"></span>' : ''}
                        </td>`;
                    }

                    const checkIcon = isPaid ? 'check-circle-2' : 'x-circle';
                    const checkClass = isPaid ? 'text-green-500' : 'text-red-400';
                    const checkBg = isPaid ? 'bg-green-50' : 'bg-red-50';

                    return `<tr class="hover:bg-slate-50 transition-colors group">
                        <td class="sticky-col sticky-shadow px-3 md:px-4 py-3 font-medium text-slate-900 border-r border-transparent bg-white group-hover:bg-slate-50">
                            <div class="flex items-center justify-between min-w-[100px]">
                                <div class="flex items-center gap-1.5"><span class="truncate max-w-[85px] md:max-w-none text-sm md:text-base">${p.name}</span><span class="text-base">🍺</span></div>
                                ${!isPaid && toPay > 0 ? '<div class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse shadow-red ml-1"></div>' : ''}
                            </div>
                        </td>
                        ${cells}
                        ${totalCell}
                        <td class="px-2 py-2 text-center ${checkBg} border-l border-slate-200 whitespace-nowrap">
                            <button onclick="Actions.togglePayment('${p.id}', ${toPay})" class="touch-target flex items-center justify-center mx-auto active:scale-90 transition-transform ${checkClass}"><i data-lucide="${checkIcon}" class="w-6 h-6"></i></button>
                        </td>
                        ${Store.editMode ? `<td class="px-1 text-center align-middle border-l border-slate-200 whitespace-nowrap"><button onclick="Actions.removePlayer('${p.id}', '${type}')" class="p-2 text-slate-300 hover:text-red-600 hover:bg-red-50 rounded-full"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>` : ''}
                    </tr>`;
                }).join('');

                const configInput = (Store.editMode && !isFijos) ? `
                    <div class="flex items-center gap-2 bg-white px-2 py-1 rounded border border-slate-200 text-[10px] md:text-xs shadow-sm ml-auto">
                        <span class="text-slate-500 font-bold">PRECIO:</span>
                        <input type="number" value="${Store.data.config.casualFee}" onchange="Actions.updateConfig('casualFee', this.value)" class="w-12 md:w-16 text-right font-mono border-b outline-none focus:border-orange-500"><span>€</span>
                    </div>` : '';

                return `<div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                    <div class="px-3 md:px-4 py-3 ${theme.b} border-b border-slate-200 flex items-center justify-between">
                        <h3 class="font-bold text-sm flex items-center gap-2 uppercase ${theme.t}"><i data-lucide="${theme.i}" class="w-4 h-4"></i> ${type === 'fijos' ? 'Equipo Fijo' : 'Jugadores Casuals'}</h3>
                        ${configInput}
                    </div>
                    <div class="overflow-x-auto scrollbar-hide">
                        <table class="w-full text-sm text-left border-collapse">
                            <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b">
                                <tr>
                                    <th class="sticky-col sticky-shadow px-3 md:px-4 py-3 z-30 min-w-[100px] bg-slate-50">Nombre</th>
                                    ${thursdays.map(d => `<th class="px-1 py-2 text-center min-w-[44px] whitespace-nowrap"><div class="flex flex-col items-center leading-tight"><span class="font-bold text-slate-800 text-xs">${d.getDate()}</span><span class="text-[9px] text-slate-400 uppercase">${d.toLocaleString('es-ES',{month:'short'})}</span></div></th>`).join('')}
                                    <th class="px-2 py-2 text-right min-w-[80px] bg-orange-50/50 text-orange-900 border-l border-slate-200 whitespace-nowrap">Total</th>
                                    <th class="px-2 py-2 text-center min-w-[60px] bg-green-50/50 text-green-900 border-l border-slate-200 whitespace-nowrap">Pagado</th>
                                    ${Store.editMode ? '<th class="w-10 border-l border-slate-200"></th>' : ''}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${rows}
                                <tr class="bg-slate-50/50"><td colspan="${thursdays.length + (Store.editMode ? 4 : 3)}" class="p-2">
                                    <div class="flex gap-2 max-w-md mx-auto items-center">
                                        <input type="text" placeholder="Nuevo jugador..." value="${Store.inputs[type]}" oninput="Actions.handleInputChange('${type}', this.value)" onkeydown="if(event.key === 'Enter') Actions.addPlayer('${type}')" class="flex-1 px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none focus:border-orange-500">
                                        <button id="btn-add-${type}" onclick="Actions.addPlayer('${type}')" ${!Store.inputs[type].trim()?'disabled':''} class="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-bold hover:bg-slate-800 disabled:opacity-50 flex items-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> AÑADIR</button>
                                    </div>
                                </td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }
        };

        window.Actions = {
            toggleEditMode: () => { Store.editMode = !Store.editMode; UI.render(); },
            changeMonth: (offset) => { Store.viewDate.setMonth(Store.viewDate.getMonth() + offset); Store.viewDate = new Date(Store.viewDate); UI.render(); },
            goToToday: () => { Store.viewDate = new Date(); UI.render(); },
            setActiveTab: (tab) => { Store.activeTab = tab; UI.render(); },
            toggleAttendance: (id, date) => Service.updateField(`attendance.${date}_${id}`, Store.data.attendance[`${date}_${id}`] ? deleteField() : true),
            togglePayment: (id, amount) => {
                const k = `${Store.getMonthKey()}_${id}`;
                Service.updateField(`payments.${k}`, (Store.data.payments[k] >= amount - 0.1) ? deleteField() : amount);
            },
            updateInvoiceTotal: (val) => Service.updateField(`invoices.${Store.getMonthKey()}`, parseFloat(val) || 0),
            updateCustomFee: (id, val) => Service.updateField(`customFees.${Store.getMonthKey()}_${id}`, val === '' ? deleteField() : parseFloat(val)),
            handleInputChange: (t, v) => { Store.inputs[t] = v; document.getElementById(`btn-add-${t}`).disabled = !v.trim(); },
            addPlayer: (t) => { 
                if(!Store.inputs[t].trim()) return; 
                const list = [...Store.data[t], {id:`${t[0]}_${Date.now()}`, name:Store.inputs[t]}];
                Store.inputs[t]=''; 
                Service.updateField(t, list).then(()=>UI.render()); 
            },
            removePlayer: (id, t) => Service.updateField(t, Store.data[t].filter(p => p.id !== id)),
            updateConfig: (k, v) => Service.updateField('config', { ...Store.data.config, [k]: parseFloat(v) || 0 })
        };

        onAuthStateChanged(auth, (u) => { Store.user = u; if(u) Service.setupSync(); else Service.initAuth(); });
    </script>
</body>
</html>
