<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pachanga de los Jueves (App)</title>
    
    <!-- ICONO PWA -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg width='256' height='256' viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='128' cy='128' r='128' fill='%23FF8C00'/%3E%3Cpath d='M128 0 A128 128 0 0 0 128 256 M25 128 A103 103 0 0 0 231 128' stroke='%23000' stroke-width='8' fill='none'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg width='256' height='256' viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='128' cy='128' r='128' fill='%23FF8C00'/%3E%3Cpath d='M128 0 A128 128 0 0 0 128 256 M25 128 A103 103 0 0 0 231 128' stroke='%23000' stroke-width='8' fill='none'/%3E%3C/svg%3E">
    
    <!-- Estilos y Iconos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Animaciones */
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        .beer-anim { display: inline-block; transform-origin: bottom center; animation: swing 3s infinite ease-in-out; }
        @keyframes swing { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
        
        /* Scrollbar invisible pero funcional */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Sticky Column con borde fuerte */
        .sticky-col { 
            position: sticky; 
            left: 0; 
            z-index: 20; 
            border-right: 2px solid #cbd5e1; /* Borde derecho fuerte */
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8); display: flex;
            justify-content: center; align-items: center; z-index: 60;
            opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(2px);
        }
        .modal-content {
            background: #fff; padding: 20px; border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 90%; max-width: 340px;
            transform: scale(0.95); transition: transform 0.3s;
        }
        .modal-open { opacity: 1; }
        .modal-open .modal-content { transform: scale(1); }

        /* MEJORAS DE VISIBILIDAD DE TABLA */
        .table-grid { border-collapse: separate; border-spacing: 0; }
        .table-cell-border { border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; }
        .table-header-border { border-right: 1px solid #94a3b8; border-bottom: 2px solid #64748b; }
        .zebra-row:nth-child(even) { background-color: #f1f5f9; } /* Fondo gris más visible */
        .zebra-row:nth-child(odd) { background-color: #ffffff; }
        .zebra-row:nth-child(even) .sticky-col { background-color: #f1f5f9; }
        .zebra-row:nth-child(odd) .sticky-col { background-color: #ffffff; }

    </style>
</head>
<body class="bg-slate-200 font-sans text-slate-900 h-full overflow-hidden flex flex-col antialiased selection:bg-orange-200">

    <!-- Diálogo Modal de PIN -->
    <div id="pin-modal" class="modal-overlay hidden">
        <div class="modal-content border-2 border-slate-800">
            <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i data-lucide="lock" class="w-5 h-5 text-red-600"></i> Acceso Administrador
            </h3>
            <p class="text-sm text-slate-700 mb-4 font-medium">Introduce el PIN para editar.</p>
            <input type="password" id="pin-input" placeholder="PIN" maxlength="4" 
                   class="w-full px-4 py-3 rounded-lg border-2 border-slate-400 focus:border-orange-600 text-center text-xl font-mono tracking-widest outline-none mb-2 bg-slate-50"
                   onkeydown="if(event.key === 'Enter') Actions.submitPin()">
            <div id="pin-error" class="text-red-600 text-xs font-bold mb-3 hidden text-center">PIN incorrecto.</div>
            <div class="flex gap-2">
                <button onclick="Actions.closePinModal()" class="flex-1 py-2 text-slate-600 hover:bg-slate-200 rounded-lg font-bold text-sm border border-slate-300">Cancelar</button>
                <button onclick="Actions.submitPin()" class="flex-1 py-2 bg-slate-900 text-white font-bold rounded-lg hover:bg-slate-800 border border-slate-900">Acceder</button>
            </div>
        </div>
    </div>

    <!-- Pantalla de Carga -->
    <div id="loading-screen" class="fixed inset-0 z-[70] flex flex-col items-center justify-center bg-slate-100 gap-4 text-slate-500 transition-opacity duration-500">
        <i data-lucide="refresh-cw" class="w-10 h-10 animate-spin-custom text-orange-600"></i>
        <span class="text-xs font-bold uppercase tracking-widest">Cargando...</span>
    </div>

    <!-- HEADER FIJO -->
    <header class="flex-none bg-slate-900 text-white z-50 shadow-xl border-b-4 border-orange-600 relative">
        <div class="max-w-4xl mx-auto px-4 py-3">
            
            <!-- Barra Superior -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-lg bg-orange-600 border-2 border-white flex items-center justify-center shadow-lg">
                        <span class="text-2xl pb-1" role="img">🏀</span>
                    </div>
                    <div>
                        <h1 class="font-black text-lg leading-none text-white flex items-center gap-2 tracking-tight">
                            PACHANGA <span class="text-orange-400">JUEVES</span>
                        </h1>
                        <div class="flex items-center gap-2 mt-1">
                            <div class="flex items-center gap-1.5 px-2 py-0.5 bg-slate-800 rounded border border-slate-600">
                                <span id="connection-icon"></span>
                                <span id="connection-text" class="text-[10px] text-slate-300 font-mono uppercase font-bold">OFFLINE</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button onclick="Actions.toggleEditMode()" id="btn-edit-mode" 
                    class="flex items-center gap-1.5 px-4 py-2 rounded-lg text-[11px] font-black uppercase transition-all border-2 bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700 hover:text-white hover:border-white active:scale-95 shadow-sm">
                    EDITAR
                </button>
            </div>

            <!-- Controles de Fecha -->
            <div class="bg-slate-800 p-2.5 rounded-lg border-2 border-slate-700 flex items-center justify-between gap-2 shadow-inner">
                <input type="date" id="start-date" onchange="Actions.updateRange(this.value, 'start')" 
                       class="flex-1 bg-slate-900 text-white rounded px-2 py-1.5 text-xs font-bold border border-slate-600 focus:border-orange-500 outline-none text-center cursor-pointer">
                <span class="text-slate-500 text-xs font-black">➜</span>
                <input type="date" id="end-date" onchange="Actions.updateRange(this.value, 'end')"
                       class="flex-1 bg-slate-900 text-white rounded px-2 py-1.5 text-xs font-bold border border-slate-600 focus:border-orange-500 outline-none text-center cursor-pointer">
            </div>

            <!-- Editor de Factura -->
            <div id="invoice-editor" class="hidden mt-2 bg-orange-900/40 border-2 border-orange-500/30 rounded-lg p-2 animate-fade-in">
                <div class="flex items-center justify-between">
                    <span class="text-[11px] font-black text-orange-100 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="receipt" class="w-4 h-4"></i> Factura Total:
                    </span>
                    <div class="flex items-center gap-1">
                        <input type="number" id="invoice-input" 
                            onchange="Actions.updateInvoiceTotal(this.value)"
                            placeholder="0.00" 
                            class="w-24 bg-slate-900 border border-slate-500 rounded px-2 py-1 text-right text-white font-mono font-bold text-sm focus:border-orange-400 outline-none shadow-inner">
                        <span class="text-orange-200 font-black text-sm">€</span>
                    </div>
                </div>
                <div id="invoice-calculation" class="text-[10px] text-orange-200 font-mono mt-1 pt-1 border-t border-orange-500/30 leading-tight font-medium"></div>
            </div>
        </div>
    </header>

    <!-- MAIN SCROLLABLE -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden bg-slate-200 relative w-full scroll-smooth">
        <div class="max-w-4xl mx-auto px-3 py-4 pb-24 space-y-5">
            
            <!-- KPIs -->
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-white p-2 rounded-xl shadow-md border-2 border-slate-300 flex flex-col justify-between h-20">
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-wider">Previsto</span>
                    <span id="kpi-expected" class="text-lg font-black text-slate-800 truncate">0.00€</span>
                </div>
                <div class="bg-white p-2 rounded-xl shadow-md border-2 border-green-600 flex flex-col justify-between h-20 relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-12 h-12 bg-green-100 rounded-bl-full border-b-2 border-l-2 border-green-200"></div>
                    <span class="text-[10px] font-black text-green-700 uppercase tracking-wider relative z-10">Recaudado</span>
                    <span id="kpi-collected" class="text-lg font-black text-green-700 relative z-10 truncate">0.00€</span>
                </div>
                <div id="kpi-debt-card" class="p-2 rounded-xl shadow-md border-2 flex flex-col justify-between h-20 transition-colors bg-white border-slate-300">
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-wider">Pendiente</span>
                    <span id="kpi-debt" class="text-lg font-black text-slate-300 truncate">0.00€</span>
                </div>
            </div>

            <!-- Pestañas STICKY -->
            <nav class="sticky top-0 z-40 bg-slate-200/95 backdrop-blur-sm pt-1 pb-2">
                <div class="flex p-1.5 bg-white border-2 border-slate-300 rounded-xl shadow-md">
                    <button onclick="Actions.setActiveTab('resumen')" class="tab-btn flex-1 py-2.5 rounded-lg text-[11px] font-black uppercase tracking-wider transition-all text-center" data-tab="resumen">Resumen</button>
                    <button onclick="Actions.setActiveTab('fijos')" class="tab-btn flex-1 py-2.5 rounded-lg text-[11px] font-black uppercase tracking-wider transition-all text-center" data-tab="fijos">Fijos</button>
                    <button onclick="Actions.setActiveTab('casuals')" class="tab-btn flex-1 py-2.5 rounded-lg text-[11px] font-black uppercase tracking-wider transition-all text-center" data-tab="casuals">Casuals</button>
                    <button onclick="Actions.setActiveTab('deudas')" class="tab-btn flex-1 py-2.5 rounded-lg text-[11px] font-black uppercase tracking-wider transition-all text-center" data-tab="deudas">Deudas</button>
                </div>
            </nav>

            <!-- Contenedor de Tablas -->
            <div id="tables-container" class="space-y-6 animate-fade-in"></div>

            <!-- Footer -->
            <footer class="text-center pt-8 opacity-60">
                <p class="text-[9px] text-slate-500 font-mono font-bold uppercase bg-slate-300 inline-block px-2 py-1 rounded">
                    ID: <span id="debug-app-id" class="select-all">...</span> | UID: <span id="debug-user-id" class="select-all">...</span>
                </p>
            </footer>
        </div>
    </main>

    <!-- Lógica JS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, deleteField, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        setLogLevel('debug');

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "KEY", authDomain: "dom", projectId: "proj" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const COLLECTION_NAME = "pachanga_data"; 
        const DOC_ID = "jueves_basket";
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'default-app';
        const ADMIN_PIN = '2333';

        const Utils = {
            getThursdaysInDateRange(s, e) {
                const d=[]; let c=new Date(s+'T00:00:00'); const z=new Date(e+'T00:00:00');
                while(c<=z){ if(c.getDay()===4) d.push(new Date(c)); c.setDate(c.getDate()+1); }
                return d;
            },
            getMonthKeysForDateRange(s, e) {
                const k=new Set(); let c=new Date(s+'T00:00:00'); const z=new Date(e+'T00:00:00');
                let r=new Date(c.getFullYear(),c.getMonth(),1);
                while(r<=z){ k.add(`${r.getFullYear()}-${String(r.getMonth()+1).padStart(2,'0')}`); r.setMonth(r.getMonth()+1); }
                k.add(`${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}`);
                return Array.from(k);
            },
            formatDateKey(d) { const z=d.getTimezoneOffset()*60000; return (new Date(d-z)).toISOString().split('T')[0]; },
            formatMoney(n) { return n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + '€'; }
        };

        const todayStr = Utils.formatDateKey(new Date());
        const INITIAL_STATE = {
            fijos: [
                {id:'f1', name:'Alvaro'}, {id:'f2', name:'Carlos'}, {id:'f3', name:'Roge'}, {id:'f4', name:'Refo'}, 
                {id:'f5', name:'Ruben'}, {id:'f6', name:'Jose'}, {id:'f7', name:'Adri'}, {id:'f8', name:'Ores'}, {id:'f9', name:'Jaime'}
            ],
            casuals: [
                {id:'c1', name:'Emilio'}, {id:'c2', name:'Lino'}, {id:'c3', name:'Raul'}, {id:'c4', name:'Edu'},
                {id:'c5', name:'Ivan'}, {id:'c6', name:'Mariano'}, {id:'c7', name:'Pablo D.'}, {id:'c8', name:'Arturo'}, 
                {id:'c9', name:'Pablo AC'}, {id:'c10', name:'Juan'}, {id:'c11', name:'Pablo T.'}, {id:'c12', name:'Rafa'}, {id:'c13', name:'Zurro'}
            ],
            attendance: {}, payments: {}, customFees: {}, invoices: {}, config: { fixedFee: 11.70, casualFee: 3.00 }
        };

        const Store = {
            dateRange: { start: todayStr, end: todayStr },
            activeTab: 'resumen',
            editMode: false,
            user: null,
            data: { ...INITIAL_STATE },
            inputs: { fijos: '', casuals: '' }
        };

        let syncReady = false;

        async function initApp() {
            loadLocal();
            if(!localStorage.getItem('pachanga_prefs_v5')) {
                const n = new Date();
                Store.dateRange = { 
                    start: Utils.formatDateKey(new Date(n.getFullYear(), n.getMonth(), 1)),
                    end: Utils.formatDateKey(new Date(n.getFullYear(), n.getMonth()+1, 0)) 
                };
            }
            document.getElementById('start-date').value = Store.dateRange.start;
            document.getElementById('end-date').value = Store.dateRange.end;
            UI.render(); 

            try {
                let cred;
                if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token) cred = await signInWithCustomToken(auth, __initial_auth_token);
                else cred = await signInAnonymously(auth);
                Store.user = cred.user;

                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION_NAME, DOC_ID);
                UI.setSync('syncing');

                onSnapshot(docRef, (snap) => {
                    UI.hideLoading();
                    if(snap.exists()) {
                        Store.data = { ...Store.data, ...snap.data() };
                        syncReady = true;
                        UI.setSync('online');
                    } else {
                        setDoc(docRef, INITIAL_STATE).then(() => { syncReady=true; UI.setSync('online'); });
                    }
                    UI.render();
                }, err => { console.error(err); UI.hideLoading(); UI.setSync('offline'); });

            } catch(e) { console.error(e); UI.hideLoading(); UI.setSync('offline'); }
        }

        async function updateCloud(field, val) {
            if(!syncReady) return;
            UI.setSync('syncing');
            const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', COLLECTION_NAME, DOC_ID);
            try {
                if(typeof field === 'object') await updateDoc(docRef, field);
                else await updateDoc(docRef, {[field]: val});
                UI.setSync('online');
            } catch(e) { UI.setSync('offline'); }
        }

        function loadLocal(){ try{ const s=localStorage.getItem('pachanga_prefs_v5'); if(s) Store.dateRange=JSON.parse(s).dateRange; }catch(e){} }
        function saveLocal(){ localStorage.setItem('pachanga_prefs_v5', JSON.stringify({dateRange: Store.dateRange})); }

        const UI = {
            setSync(st) {
                const m = {
                    online: { i:'wifi', c:'text-green-400', t:'ONLINE' },
                    offline: { i:'wifi-off', c:'text-slate-400', t:'OFFLINE' },
                    syncing: { i:'refresh-cw', c:'text-orange-400', t:'SYNC', a:'animate-spin' }
                };
                const s = m[st];
                const el = document.getElementById('connection-icon');
                const txt = document.getElementById('connection-text');
                if(el) el.innerHTML = `<i data-lucide="${s.i}" class="w-3 h-3 ${s.a||''}"></i>`;
                if(txt) { txt.textContent = s.t; txt.className = `text-[9px] font-mono uppercase ${s.c} font-bold`; }
                lucide.createIcons();
            },
            hideLoading(){ document.getElementById('loading-screen').classList.add('hidden'); },

            render() {
                const thursdays = Utils.getThursdaysInDateRange(Store.dateRange.start, Store.dateRange.end);
                const rangeKeys = Utils.getMonthKeysForDateRange(Store.dateRange.start, Store.dateRange.end);
                const firstMK = rangeKeys[0];

                // Edit Mode
                const editBtn = document.getElementById('btn-edit-mode');
                const invEditor = document.getElementById('invoice-editor');
                const invInput = document.getElementById('invoice-input');
                
                if(Store.editMode) {
                    editBtn.innerHTML = `<i data-lucide="unlock" class="w-3 h-3"></i> OK`;
                    editBtn.className = "flex items-center gap-1.5 px-4 py-2 rounded-lg text-[11px] font-black transition-all border-2 bg-orange-600 border-orange-600 text-white shadow-lg active:scale-95";
                    invEditor.classList.remove('hidden');
                    invInput.value = (firstMK && Store.data.invoices[firstMK]) || '';
                } else {
                    editBtn.innerHTML = `<i data-lucide="lock" class="w-3 h-3"></i> EDITAR`;
                    editBtn.className = "flex items-center gap-1.5 px-4 py-2 rounded-lg text-[11px] font-black uppercase transition-all border-2 bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700 hover:text-white hover:border-white active:scale-95 shadow-sm";
                    invEditor.classList.add('hidden');
                }

                // Tabs
                document.querySelectorAll('.tab-btn').forEach(b => {
                    const active = b.dataset.tab === Store.activeTab;
                    b.className = active 
                        ? "tab-btn flex-1 py-2 rounded-lg text-[11px] font-black uppercase tracking-wider transition-all bg-slate-900 text-white shadow-md transform scale-100 border border-slate-900"
                        : "tab-btn flex-1 py-2 rounded-lg text-[11px] font-black uppercase tracking-wider transition-all text-slate-500 hover:bg-slate-100 hover:text-slate-800 border border-transparent";
                });

                // Calculations
                let totalCasuals = 0;
                Store.data.casuals.forEach(p => {
                    const g = thursdays.filter(d => Store.data.attendance[`${Utils.formatDateKey(d)}_${p.id}`]).length;
                    totalCasuals += (g * Store.data.config.casualFee);
                });

                const invAmt = firstMK ? (Store.data.invoices[firstMK] || 0) : 0;
                const fijosNet = Math.max(0, invAmt - totalCasuals);
                const baseFee = Store.data.fijos.length > 0 ? fijosNet / Store.data.fijos.length : 0;

                let expTotal=0, colTotal=0, expFijos=0, debts=[];

                Store.data.fijos.forEach(p => {
                    const cf = Store.data.customFees[`${firstMK}_${p.id}`];
                    const toPay = cf !== undefined ? parseFloat(cf) : baseFee;
                    expFijos += Math.max(0, toPay);
                    let paid = 0;
                    rangeKeys.forEach(mk => paid += (Store.data.payments[`${mk}_${p.id}`] || 0));
                    colTotal += paid;
                    if(toPay - paid > 0.1) debts.push({name:p.name, debt:toPay-paid, type:'Fijo'});
                });
                expTotal = expFijos + totalCasuals;

                Store.data.casuals.forEach(p => {
                    const g = thursdays.filter(d => Store.data.attendance[`${Utils.formatDateKey(d)}_${p.id}`]).length;
                    const toPay = g * Store.data.config.casualFee;
                    let paid = 0;
                    rangeKeys.forEach(mk => paid += (Store.data.payments[`${mk}_${p.id}`] || 0));
                    colTotal += paid;
                    if(toPay - paid > 0.1) debts.push({name:p.name, debt:toPay-paid, type:'Casual'});
                });

                document.getElementById('kpi-expected').textContent = Utils.formatMoney(expTotal);
                document.getElementById('kpi-collected').textContent = Utils.formatMoney(colTotal);
                document.getElementById('kpi-debt').textContent = Utils.formatMoney(expTotal - colTotal);

                const debtCard = document.getElementById('kpi-debt-card');
                const debtTxt = document.getElementById('kpi-debt');
                if(expTotal - colTotal > 0.1) {
                    debtCard.className = "p-2 rounded-xl shadow-md border-2 flex flex-col justify-between h-20 transition-colors bg-red-50 border-red-300";
                    debtTxt.className = "text-lg font-black text-red-600 truncate";
                } else {
                    debtCard.className = "p-2 rounded-xl shadow-md border-2 flex flex-col justify-between h-20 transition-colors bg-white border-slate-300";
                    debtTxt.className = "text-lg font-black text-slate-300 truncate";
                }

                if(Store.editMode) {
                     document.getElementById('invoice-calculation').innerHTML = `Total: ${invAmt.toFixed(2)}€ - Casuals: ${totalCasuals.toFixed(2)}€ = <b>${fijosNet.toFixed(2)}€</b> (Neto Fijos)<br>Cuota sugerida: <b>${baseFee.toFixed(2)}€</b> /jugador`;
                }

                const cont = document.getElementById('tables-container');
                let h = '';
                if(Store.activeTab==='resumen' || Store.activeTab==='fijos') h += this.table('fijos', Store.data.fijos, thursdays, baseFee, rangeKeys);
                if(Store.activeTab==='resumen' || Store.activeTab==='casuals') h += this.table('casuals', Store.data.casuals, thursdays, Store.data.config.casualFee, rangeKeys);
                if(Store.activeTab==='deudas') h += this.debtList(debts);
                
                cont.innerHTML = h;
                
                // Bugfix: Ensure elements exist before setting textContent
                const appIdEl = document.getElementById('debug-app-id');
                if(appIdEl) appIdEl.textContent = APP_ID;
                
                const userIdEl = document.getElementById('debug-user-id');
                if(userIdEl) userIdEl.textContent = Store.user?.uid || '...';
                
                lucide.createIcons();
                saveLocal();
            },

            table(type, players, dates, baseFee, monthKeys) {
                const isFijos = type === 'fijos';
                const color = isFijos ? 'text-orange-700' : 'text-blue-700';
                const bgHeader = isFijos ? 'bg-orange-50' : 'bg-blue-50';
                const icon = isFijos ? 'lock' : 'unlock';
                
                const rows = players.map(p => {
                    let fee = 0, paid = 0;
                    if(isFijos) {
                        const cf = Store.data.customFees[`${monthKeys[0]}_${p.id}`];
                        fee = Math.max(0, cf !== undefined ? parseFloat(cf) : baseFee);
                    } else {
                        const g = dates.filter(d => Store.data.attendance[`${Utils.formatDateKey(d)}_${p.id}`]).length;
                        fee = g * Store.data.config.casualFee;
                    }
                    monthKeys.forEach(mk => paid += (Store.data.payments[`${mk}_${p.id}`] || 0));
                    const isPaid = (fee - paid) <= 0.1;

                    const cells = dates.map(d => {
                        const k = Utils.formatDateKey(d);
                        const act = !!Store.data.attendance[`${k}_${p.id}`];
                        return `<td class="p-1 text-center table-cell-border">
                            <div onclick="Actions.toggleAtt('${p.id}', '${k}')" class="w-9 h-9 mx-auto rounded-lg flex items-center justify-center cursor-pointer transition-all ${act ? 'bg-slate-900 text-white shadow-md scale-105 border-2 border-slate-700' : 'bg-white border-2 border-slate-300 hover:border-orange-400'}">
                                ${act ? '<i data-lucide="check" class="w-5 h-5 stroke-[3]"></i>' : ''}
                            </div>
                        </td>`;
                    }).join('');

                    const totalDisplay = (Store.editMode && isFijos) 
                        ? `<input type="number" value="${Store.data.customFees[`${monthKeys[0]}_${p.id}`]??''}" placeholder="${baseFee.toFixed(2)}" onchange="Actions.setCF('${p.id}',this.value)" class="w-14 text-right bg-orange-50 rounded border-2 border-orange-300 text-xs font-bold outline-none focus:border-orange-600">` 
                        : fee.toFixed(2);

                    return `<tr class="zebra-row group hover:bg-orange-50 transition-colors">
                        <td class="sticky-col px-3 py-3 text-sm font-bold text-slate-900 group-hover:bg-orange-50 border-b border-slate-300 shadow-sm">
                            <div class="flex items-center justify-between w-full">
                                <span>${p.name}</span>
                                ${!isPaid && fee > 0 ? '<span class="w-2 h-2 bg-red-600 rounded-full ml-2"></span>' : ''}
                            </div>
                        </td>
                        ${cells}
                        <td class="px-2 text-right font-mono text-xs font-bold text-slate-800 bg-slate-100 table-cell-border">${totalDisplay}</td>
                        <td class="px-2 text-center table-cell-border bg-white">
                            <button onclick="Actions.togglePay('${p.id}', ${fee})" class="mx-auto p-1 rounded-full transition-all ${isPaid ? 'text-green-600 bg-green-50 ring-2 ring-green-200' : 'text-slate-300 hover:text-green-500 hover:bg-slate-50 ring-2 ring-slate-200'}"><i data-lucide="${isPaid?'check':'banknote'}" class="w-5 h-5"></i></button>
                        </td>
                        ${Store.editMode ? `<td class="px-1 text-center border-b border-slate-300"><button onclick="Actions.delP('${type}','${p.id}')" class="text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>` : ''}
                    </tr>`;
                }).join('');

                const headers = dates.map(d => `<th class="px-1 py-2 text-center min-w-[48px] table-header-border bg-slate-100"><div class="flex flex-col items-center justify-center gap-0.5 leading-none"><span class="text-[8px] font-bold uppercase text-slate-400">${d.toLocaleDateString('es',{month:'short'}).slice(0,3)}</span><span class="text-sm font-black text-slate-800">${d.getDate()}</span><span class="text-[8px] font-bold uppercase text-slate-500">${d.toLocaleDateString('es',{weekday:'short'}).slice(0,2)}</span></div></th>`).join('');

                return `<div class="bg-white rounded-xl shadow-md border-2 border-slate-300 overflow-hidden">
                    <div class="px-4 py-3 border-b-2 border-slate-300 flex justify-between items-center ${bgHeader}">
                        <h3 class="font-black text-sm uppercase ${color} flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4"></i> ${isFijos?'Equipo Fijo':'Casuals'}</h3>
                        ${(Store.editMode && !isFijos) ? `<div class="flex items-center gap-1 text-xs font-bold"><span>PRECIO:</span><input type="number" value="${Store.data.config.casualFee}" onchange="Actions.setConfig('casualFee',this.value)" class="w-12 text-right border-2 border-slate-300 rounded px-1 font-mono">€</div>` : ''}
                    </div>
                    <div class="overflow-x-auto scrollbar-hide">
                        <table class="w-full table-grid">
                            <thead><tr class="bg-slate-200"><th class="sticky-col px-3 py-2 text-left text-[10px] text-slate-600 uppercase font-black min-w-[120px] bg-slate-200 z-30 border-b-2 border-slate-400 shadow-sm">Jugador</th>${headers}<th class="px-2 text-right text-[10px] font-black uppercase bg-slate-200 min-w-[70px] table-header-border text-slate-600">Total</th><th class="px-2 text-center text-[10px] font-black uppercase min-w-[60px] table-header-border bg-slate-200 text-slate-600">Pago</th>${Store.editMode?'<th class="bg-slate-200 border-b-2 border-slate-400"></th>':''}</tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                    <div class="p-3 border-t-2 border-slate-300 flex gap-2 bg-slate-50">
                        <input type="text" placeholder="Añadir nuevo..." onkeydown="if(event.key==='Enter') Actions.addP('${type}',this.value)" class="flex-1 px-4 py-2 text-sm border-2 border-slate-300 rounded-lg bg-white outline-none focus:border-slate-900 font-medium">
                        <button onclick="const i=this.previousElementSibling;Actions.addP('${type}',i.value);i.value=''" class="px-4 py-2 bg-slate-900 text-white rounded-lg font-bold text-xs hover:bg-slate-700 uppercase">Añadir</button>
                    </div>
                </div>`;
            },
            debtList(debts) {
                if(!debts.length) return `<div class="bg-green-50 border-2 border-green-200 p-6 rounded-xl text-center text-green-800 font-black text-sm shadow-sm">¡Todo al día! Excelente. 🎉</div>`;
                return `<div class="bg-white rounded-xl border-2 border-red-200 shadow-md overflow-hidden"><div class="px-4 py-3 bg-red-50 border-b-2 border-red-200 text-red-700 font-black text-sm uppercase flex items-center gap-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> Pendientes</div><div class="divide-y-2 divide-slate-100">${debts.map(d => `<div class="px-4 py-3 flex justify-between items-center hover:bg-red-50 transition-colors"><div><p class="font-bold text-sm text-slate-900">${d.name}</p><p class="text-[10px] text-red-500 uppercase font-black tracking-wide">${d.type}</p></div><span class="font-mono font-black text-lg text-red-600 bg-red-50 px-2 py-1 rounded border border-red-100">${d.debt.toFixed(2)}€</span></div>`).join('')}</div></div>`;
            }
        };

        window.Actions = {
            toggleEditMode: () => Store.editMode ? (Store.editMode=false, UI.render()) : document.getElementById('pin-modal').classList.remove('hidden') || setTimeout(()=>document.getElementById('pin-modal').classList.add('modal-open'),10),
            closePinModal: () => { document.getElementById('pin-modal').classList.remove('modal-open'); setTimeout(()=>document.getElementById('pin-modal').classList.add('hidden'),300); },
            submitPin: () => { if(document.getElementById('pin-input').value === ADMIN_PIN) { Store.editMode=true; Actions.closePinModal(); UI.render(); } else document.getElementById('pin-error').classList.remove('hidden'); },
            updateRange: (v,t) => { if(!v)return; Store.dateRange[t]=v; if(new Date(Store.dateRange.start)>new Date(Store.dateRange.end)) Store.dateRange[t==='start'?'end':'start']=v; UI.render(); },
            setActiveTab: t => { Store.activeTab=t; UI.render(); },
            toggleAttendance: (pid,k) => { if(!Store.editMode)return; const key=`attendance.${k}_${pid}`; updateCloud(key, Store.data.attendance[`${k}_${pid}`]?deleteField():true); if(!syncReady){ if(Store.data.attendance[`${k}_${pid}`]) delete Store.data.attendance[`${k}_${pid}`]; else Store.data.attendance[`${k}_${pid}`]=true; UI.render(); } },
            toggleAtt: (pid, k) => Actions.toggleAttendance(pid,k),
            togglePay: (pid,amt) => { const mk=Utils.getMonthKeysForDateRange(Store.dateRange.start,Store.dateRange.end)[0]; const k=`payments.${mk}_${pid}`; const cur=Store.data.payments[k]||0; const val=(cur>=amt-0.1)?deleteField():amt; updateCloud(k,val); if(!syncReady){ if(cur>=amt-0.1)delete Store.data.payments[k]; else Store.data.payments[k]=amt; UI.render(); } },
            updateInvoiceTotal: v => { const mk=Utils.getMonthKeysForDateRange(Store.dateRange.start,Store.dateRange.end)[0]; if(!mk)return; const val=parseFloat(v); updateCloud(`invoices.${mk}`, val?val:deleteField()); if(!syncReady){ if(val)Store.data.invoices[mk]=val; else delete Store.data.invoices[mk]; UI.render(); } },
            setCF: (pid,v) => { const mk=Utils.getMonthKeysForDateRange(Store.dateRange.start,Store.dateRange.end)[0]; updateCloud(`customFees.${mk}_${pid}`, (v!=='')?parseFloat(v):deleteField()); },
            setConfig: (k,v) => updateCloud(`config.${k}`, parseFloat(v)||0),
            addP: (t,n) => { if(!n.trim())return; const l=[...Store.data[t],{id:t[0]+Date.now(),name:n.trim()}]; updateCloud(t,l); if(!syncReady){Store.data[t]=l;UI.render();} },
            delP: (t,id) => { if(!confirm('¿Borrar?'))return; const l=Store.data[t].filter(p=>p.id!==id); updateCloud(t,l); if(!syncReady){Store.data[t]=l;UI.render();} }
        };

        window.onload = initApp;
    </script>
</body>
</html>
