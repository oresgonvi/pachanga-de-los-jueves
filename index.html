<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pachanga de los Jueves</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Animaciones y estilos extra */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom { animation: spin 1s linear infinite; }
    .beer-anim { display: inline-block; transform-origin: bottom center; animation: swing 2s infinite ease-in-out; }
    @keyframes swing {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    
    /* Evitar zoom en inputs en móvil */
    input, select, textarea { font-size: 16px; }
  </style>
</head>
<body class="bg-slate-100 font-sans pb-20 text-slate-800">
  <!-- App Container -->
  <div id="app" class="min-h-screen">
    <!-- Loading Screen (Initial) -->
    <div id="loading-screen" class="flex flex-col items-center justify-center min-h-screen gap-4 text-slate-400">
      <i data-lucide="refresh-cw" class="w-8 h-8 animate-spin-custom text-orange-500"></i>
      <span class="text-xs font-bold uppercase tracking-widest">Conectando al vestuario...</span>
    </div>
    
    <!-- Main Content (Hidden initially) -->
    <div id="main-content" class="hidden">
      
      <!-- Header -->
      <div class="bg-slate-900 text-white sticky top-0 z-40 shadow-xl border-b border-slate-800">
        <div class="max-w-4xl mx-auto px-4 py-4">
          
          <!-- Top Bar -->
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
              <div class="p-2.5 rounded-full text-white border-2 border-slate-800 flex items-center justify-center bg-slate-800 relative group">
                <span class="text-2xl leading-none transform group-hover:scale-110 transition-transform" role="img" aria-label="basketball">🏀</span>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-xl font-extrabold tracking-tight">Pachanga Jueves</h1>
                  <span class="beer-anim text-lg" role="img" aria-label="beer">🍺</span>
                </div>
                <div id="connection-status" class="flex items-center gap-1.5 mt-0.5">
                  <span id="connection-icon" class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
                  <span id="connection-text" class="text-[9px] text-slate-400 font-medium uppercase tracking-wider">Conectado</span>
                </div>
              </div>
            </div>
          </div>
          
          <!-- Month Navigator -->
          <div class="flex items-center justify-between bg-slate-800/50 backdrop-blur-sm p-1.5 rounded-full shadow-inner mb-6">
            <button id="btn-prev-month" class="w-10 h-10 flex items-center justify-center hover:bg-slate-700 rounded-full transition-colors">
              <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <div class="flex-1 text-center">
              <div id="current-month-year" class="text-lg font-bold">Enero 2025</div>
              <div id="week-range" class="text-[10px] text-slate-400 uppercase tracking-widest font-medium">Semana del 1 al 7</div>
            </div>
            <button id="btn-next-month" class="w-10 h-10 flex items-center justify-center hover:bg-slate-700 rounded-full transition-colors">
              <i data-lucide="chevron-right" class="w-6 h-6"></i>
            </button>
          </div>
          
          <!-- Days of Week (Horizontal Calendar) -->
          <div class="grid grid-cols-7 gap-2">
            <div class="text-center">
              <div class="text-[9px] text-slate-500 uppercase tracking-widest font-bold mb-1.5">Lun</div>
              <button class="day-button w-full aspect-square rounded-lg hover:bg-slate-800 transition-all text-xs font-medium" data-day="1">
                <div>1</div>
              </button>
            </div>
            <!-- Más días aquí -->
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
    
    // Hide loading screen after page load
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('main-content').classList.remove('hidden');
      }, 500);
    });
    
    // Add your JavaScript logic here
    console.log('Pachanga app initialized');
  </script>
</body>
</html>
